<DOCTYPE html>
<html>
<head>
    <title>Multimedia Player</title>
</head>
<body>

    <h1>Multimedia Player</h1>

    <h2>Audio Section</h2>
    <audio controls>
        <source src="./file_example_MP3_700KB.mp3" type="audio/mpeg">

        Your browser does not support the video element.
    </video>

</body>
</html>
